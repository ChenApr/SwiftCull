name: Build & Release

on:
  push:
    branches: [ "main", "release/**" ]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - '**/*.rst'
      - 'docs/**'
      - 'imgs/badges/**'
      - 'LICENSE'
      - 'LICENSE.*'
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Serialize main builds/releases so two pushes cannot choose the same version.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine release version
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          python3 <<'PY'
          import os
          import re
          import subprocess

          def stable_tags(*args):
              tags = subprocess.check_output(["git", "tag", *args], text=True).splitlines()
              return [
                  (tuple(map(int, match.groups())), tag)
                  for tag in tags
                  if (match := re.fullmatch(r"v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", tag))
              ]

          current = stable_tags("--points-at", "HEAD")
          if current:
              # Re-running a published commit reuses its tag.
              _, tag = max(current)
          else:
              existing = stable_tags("--list")
              major, minor, patch = max(existing)[0] if existing else (0, 1, -1)
              tag = f"v{major}.{minor}.{patch + 1}"

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag={tag}\nversion={tag[1:]}\n")
          print(f"Release version: {tag}")
          PY

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install build and test tools
        run: brew install xcodegen ffmpeg

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set --
          if [[ -n "$APP_VERSION" ]]; then
            set -- MARKETING_VERSION="$APP_VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
          fi
          xcodebuild \
            -project SwiftCull.xcodeproj \
            -scheme SwiftCull \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/deriveddata" \
            CONFIGURATION_BUILD_DIR="$RUNNER_TEMP/build/Release" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Automatic \
            "$@" \
            build

      - name: Watermark rendering smoke test
        run: |
          bash Tests/run-watermark-smoke.sh
          bash Tests/run-watermark-font-download-smoke.sh

      - name: Photo actions and crop regression tests
        run: |
          bash Tests/run-photo-action-scope-smoke.sh
          bash Tests/run-crop-smoke.sh

      - name: Thumbnail and data integrity regression tests
        run: |
          bash Tests/run-thumbnail-pipeline-smoke.sh
          bash Tests/run-data-integrity-smoke.sh
          bash Tests/run-lazy-metadata-smoke.sh
          bash Tests/run-grid-presentation-smoke.sh
          bash Tests/run-preview-resolution-smoke.sh

      - name: Live Photo smoke test
        run: bash Tests/run-live-photo-smoke.sh

      - name: Package DMG
        run: |
          APP_PATH="$RUNNER_TEMP/build/Release/SwiftCull.app"
          DMG_DIR="$RUNNER_TEMP/dmg"
          DMG_RW="$RUNNER_TEMP/dmg_rw.dmg"
          DMG_OUTPUT="SwiftCull.dmg"

          echo "==> Preparing DMG contents..."
          mkdir -p "$DMG_DIR"
          cp -R "$APP_PATH" "$DMG_DIR/"
          ln -s /Applications "$DMG_DIR/Applications"

          echo "==> Creating DMG..."
          hdiutil create \
            -volname "SwiftCull" \
            -srcfolder "$DMG_DIR" \
            -ov \
            -format UDZO \
            -imagekey zlib-level=9 \
            "$DMG_OUTPUT"

          echo "==> DMG created: $(du -sh "$DMG_OUTPUT" | cut -f1)"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftCull.dmg
          path: SwiftCull.dmg

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SwiftCull.dmg

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: SwiftCull.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: false
          make_latest: true
