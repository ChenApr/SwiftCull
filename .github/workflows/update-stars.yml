name: Update Star Badge

on:
  schedule:
    - cron: '17 */6 * * *'
  watch:
    types: [started]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-star-badge
  cancel-in-progress: false

jobs:
  update:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Read current Star count and update badge
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          request = Request(
              f"https://api.github.com/repos/{os.environ['REPOSITORY']}",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                       "Accept": "application/vnd.github+json"},
          )
          with urlopen(request, timeout=30) as response:
              count = json.load(response)["stargazers_count"]
          if type(count) is not int or count < 0:
              raise ValueError("Invalid Star count")
          right = max(30, len(str(count)) * 8 + 12)
          Path("imgs/badges/stars.svg").write_text(
              f'<svg xmlns="http://www.w3.org/2000/svg" width="{48 + right}" height="20" role="img" aria-label="stars: {count}">\n'
              f'  <title>GitHub Stars: {count}</title>\n'
              '  <rect width="48" height="20" fill="#555" />\n'
              f'  <rect x="48" width="{right}" height="20" fill="#007ec6" />\n'
              '  <g fill="#fff" text-anchor="middle" font-family="Verdana,DejaVu Sans,sans-serif" font-size="11">\n'
              '    <text x="24" y="14">stars</text>\n'
              f'    <text x="{48 + right / 2:g}" y="14">{count}</text>\n'
              '  </g>\n</svg>\n', encoding="utf-8")
          print(f"Stars: {count}")
          PY

      - name: Commit changed badge
        run: |
          if git diff --quiet -- imgs/badges/stars.svg; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add imgs/badges/stars.svg
          git commit -m 'docs: update GitHub Star count'
          git push origin HEAD:main
